<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfred</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">Alfred</div>

        <div class="completion-card">
            <h1>Good morning, {{ user_name }}. I'm ready.</h1>
            <p class="subtext">Tomorrow morning I'll {{ first_action }}. You can always change this.</p>

            <a href="/lesson/01" class="primary-btn">Show me what you can do</a>
        </div>
    </div>

    <style>
        .completion-card {
            text-align: center;
            animation: fadeIn 0.6s ease-in;
        }

        .completion-card h1 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .subtext {
            margin-bottom: 2rem;
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .primary-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .primary-btn:hover {
            background-color: #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>

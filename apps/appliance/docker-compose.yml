# LocalLedger appliance — Postgres + FastAPI.
#
# Ollama deliberately does NOT run here. On Apple Silicon, Docker containers run
# inside a Linux VM with no access to the Metal GPU, so a containerised vision
# model is CPU-only and unusably slow. Ollama runs natively on the host instead
# (`brew services start ollama`), which also gives it start-on-boot behaviour
# equivalent to `restart: unless-stopped`. Everything stays on this machine.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-localledger}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localledger} -d ${POSTGRES_DB:-localledger}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Why: bound to loopback only. Nothing about this appliance should be
    # reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-localledger}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-localledger}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:?set OLLAMA_VISION_MODEL in .env}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      DATA_ROOT: /data
      WATCH_ENABLED: ${WATCH_ENABLED:-true}
      WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/inbox:/data/inbox
      - ./data/archive:/data/archive
      - ./data/review:/data/review
    # Why: makes the host's native Ollama reachable as host.docker.internal on
    # Linux too, so the same compose file works if the fleet grows beyond macOS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

name: appliance

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: tests (postgres 16)
    runs-on: ubuntu-latest

    # Why: a real PostgreSQL service, not SQLite. The schema uses ENUM, JSONB
    # and IDENTITY columns, so a stand-in would test something other than what
    # ships on the appliance.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localledger
          POSTGRES_PASSWORD: localledger
          POSTGRES_DB: localledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/appliance/requirements.txt

      - name: Install dependencies
        working-directory: apps/appliance
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Apply schema
        env:
          PGPASSWORD: localledger
        run: |
          psql -h localhost -p 5432 -U localledger -d localledger \
            -v ON_ERROR_STOP=1 -f apps/appliance/db/init.sql

      - name: Run tests
        working-directory: apps/appliance
        env:
          LOCALLEDGER_TEST_DSN: postgresql+psycopg://localledger:localledger@localhost:5432/localledger
        run: pytest tests -q

      # Why: pytest never imports the FastAPI module, so a broken route or a bad
      # import there would otherwise reach the Mini undetected.
      - name: Import check the API
        working-directory: apps/appliance
        env:
          DATABASE_URL: postgresql+psycopg://localledger:localledger@localhost:5432/localledger
          OLLAMA_VISION_MODEL: ci-placeholder-model
          WATCH_ENABLED: "false"
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes ok')"
